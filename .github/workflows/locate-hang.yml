name: locate-hang

# One-off diagnostic: run the suite in a few explicit groups, alternating the
# POSIX-only and cross-platform files, so a file that hangs before reporting can
# be narrowed to a handful of candidates in one dispatch. Delete this workflow
# once the hang is identified and fixed.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: half-a runs files 0-29, half-b runs 30-59, posix runs the Linux-sensitive subset
        required: true
        default: posix
        type: choice
        options: [half-a, half-b, posix]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: select the group
        id: group
        run: |
          set -euo pipefail
          mapfile -t ALL < <(ls tests/*.spec.ts | sort)
          case "${{ inputs.mode }}" in
            half-a) FILES=("${ALL[@]:0:30}") ;;
            half-b) FILES=("${ALL[@]:30}") ;;
            posix)
              FILES=(
                tests/app-version.spec.ts
                tests/loopback.spec.ts
                tests/atomic-write.spec.ts
                tests/probe-service.spec.ts
                tests/probe-route.spec.ts
                tests/web-status.spec.ts
                tests/model-visibility.spec.ts
                tests/update-route.spec.ts
                tests/settings-integration.spec.ts
                tests/catalog-lifecycle.spec.ts
                tests/auth.spec.ts
                tests/host-heartbeat.spec.ts
              ) ;;
          esac
          printf '%s\n' "${FILES[@]}" > ci-group.txt
          echo "running ${#FILES[@]} files"
          cat ci-group.txt

      # Each file gets its own vitest process with a hard timeout, so a hang
      # names the file instead of stalling the job: the first file that does not
      # print DONE is the culprit.
      - name: run each file with a per-file timeout
        run: |
          set -uo pipefail
          FAILED=0
          while read -r f; do
            echo "::group::${f}"
            if timeout 90s pnpm exec vitest run "$f" --reporter=dot; then
              echo "DONE ${f}"
            else
              rc=$?
              if [ "$rc" -eq 124 ]; then
                echo "TIMEOUT ${f}"
              else
                echo "FAILED ${f} (rc=${rc})"
                FAILED=1
              fi
            fi
            echo "::endgroup::"
          done < ci-group.txt
          exit "$FAILED"
