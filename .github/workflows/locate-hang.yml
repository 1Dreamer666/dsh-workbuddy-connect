name: locate-hang

# One-off diagnostic for the ubuntu stall. Runs the second half of the suite one
# file per vitest process, each behind a hard `timeout`, so the file that does
# not print DONE is the culprit. Delete once the cause is fixed.
on:
  workflow_dispatch:
    inputs:
      half:
        description: which half of the sorted file list to run
        required: true
        default: second
        type: choice
        options: [first, second]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: run each file under a hard timeout
        run: |
          set -uo pipefail
          mapfile -t ALL < <(ls tests/*.spec.ts | sort)
          if [ '${{ inputs.half }}' = 'first' ]; then
            FILES=("${ALL[@]:0:30}")
          else
            FILES=("${ALL[@]:30}")
          fi
          echo "running ${#FILES[@]} files"
          for f in "${FILES[@]}"; do
            start=$(date +%s)
            if timeout -k 5 120s pnpm exec vitest run "$f" --reporter=dot > /tmp/out.log 2>&1; then
              echo "DONE $(($(date +%s)-start))s ${f}"
            else
              rc=$?
              echo "::error::$([ "$rc" -eq 124 ] && echo TIMEOUT || echo FAILED) ${f} (rc=${rc})"
              tail -40 /tmp/out.log
            fi
          done
