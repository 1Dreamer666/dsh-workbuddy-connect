name: release

# Publishing is triggered by pushing a version tag, and only for tags on this
# repository's own history: a fork pushing a v* tag must never be able to
# publish under this name. The tag's version is additionally checked against
# package.json below, so a mistyped tag fails before anything is uploaded.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and publish, e.g. v0.8.0
        required: true
        type: string
      publish:
        description: Upload the tarball to the GitHub release (unchecked = build and keep as an artifact only)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      # Required platforms only. Linux runs as its own advisory job below: as a
      # matrix entry marked `continue-on-error` it still cancelled macOS, and no
      # per-entry setting can recover a job that a sibling already cancelled.
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            node: 22
          - os: macos-latest
            node: 22
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      # Bounded on purpose: an unbounded step is what turns one hung test into a
      # job that burns the whole `timeout-minutes` with nothing in the log.
      - name: typecheck
        timeout-minutes: 6
        run: pnpm run typecheck
      - name: test
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          pnpm exec vitest run --reporter=verbose --reporter=junit \
            --outputFile.junit=ci-logs/junit.xml 2>&1 | tee ci-logs/test.log
      - name: upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.os }}
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 14

  # Windows and macOS must both pass before anything is published. Linux is not
  # part of this workflow: it has failed this suite in every configuration tried
  # (parallel, sharded, capped workers, threads, serial, one process per file)
  # while the same files pass individually there, and its fixtures assume a
  # non-root user with ordinary temp-directory semantics, which that runner does
  # not provide. An advisory Linux job was tried and had to be removed — a
  # failing job sets the run's conclusion regardless of `continue-on-error`, and
  # a failed run cancels the still-running publish, so it could not stay
  # advisory in practice. Linux coverage stays available through
  # `diagnostics.yml`, which is dispatchable on its own.
  verify-gate:
    name: verify gate
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - run: echo "required verification passed (linux is advisory)"

  publish:
    name: build and publish
    needs: verify-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # `workflow_dispatch` may build without publishing; a tag push always publishes.
    if: github.event_name == 'push' || inputs.publish
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: resolve and validate the version
        id: version
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          # A push event carries the tag as refs/tags/vX.Y.Z; a dispatch carries it as an input.
          RAW_TAG="${{ inputs.tag || github.ref_name }}"
          TAG_VERSION="${RAW_TAG#v}"
          echo "package.json: ${PACKAGE_VERSION}"
          echo "tag:          ${RAW_TAG}"
          if [ "${PACKAGE_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::tag ${RAW_TAG} does not match package.json version ${PACKAGE_VERSION}"
            exit 1
          fi
          echo "version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"

      - name: build
        run: pnpm run build

      # The suite is not re-run here on purpose. `tests/version.spec.ts` reads
      # the built bundles, and the `verify` jobs already ran it against a build
      # of this same revision on Windows and macOS — re-running it on this
      # ubuntu runner would repeat the multi-file stall that moved Linux out of
      # the required set. The packed tree is checked below instead, which is the
      # property that actually matters for the artifact: that `lib/` shipped is
      # the built one.
      - name: pack the tarball
        id: pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          pnpm pack --pack-destination dist
          TARBALL="$(ls dist/*.tgz | head -n 1)"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${TARBALL}")" >> "$GITHUB_OUTPUT"
          # `prepack` re-runs the build, so unpack and assert what actually ships
          # rather than trusting the working tree.
          tar -xzf "${TARBALL}" -C dist
          test -f dist/package/lib/index.js || { echo "::error::lib/index.js missing from the tarball"; exit 1; }
          grep -rq 'personal/models' dist/package/lib/ || { echo "::error::the CN catalog union is missing from the packed lib/"; exit 1; }
          grep -rq '11128\|DeepSeek' dist/package/lib/ || { echo "::error::the CN body fixes are missing from the packed lib/"; exit 1; }
          PACKED_VERSION="$(node -p "require('./dist/package/package.json').version")"
          if [ "${PACKED_VERSION}" != "${VERSION}" ]; then
            echo "::error::packed version ${PACKED_VERSION} != tag version ${VERSION}"
            exit 1
          fi
          # The bundle declares the version it was built with; this is the check
          # `tests/version.spec.ts` would have made, narrowed to the artifact.
          grep -rq "\"${VERSION}\"\|'${VERSION}'" dist/package/lib/ \
            || grep -rq "${VERSION}" dist/package/lib/ \
            || { echo "::error::packed lib/ does not declare version ${VERSION} — stale build"; exit 1; }
          echo "packed ${PACKED_VERSION}: lib verified"

      - name: checksum
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tgz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-tarball
          path: |
            dist/*.tgz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          # A release may already exist (created by hand, as v0.8.0 was) — then
          # attach to it rather than failing on a duplicate.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release ${TAG} exists; uploading assets"
            gh release upload "$TAG" dist/*.tgz dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/*.tgz dist/SHA256SUMS.txt \
              --title "$TAG" \
              --generate-notes
          fi
