# Register the WorkBuddy provider without changing the profile's current
# default model. The plugin reuses the WorkBuddy desktop app's sign-in; no
# separate OAuth flow is started.
- insert:
    - id: llm-workbuddy
      # Must match package.json's `name`: the loader resolves this specifier, and
      # a mismatch fails the whole profile at startup.
      name: '@venshell/dsh-workbuddy-connect'
